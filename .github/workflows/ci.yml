name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev ffmpeg libmpv2 playerctl dbus fontconfig

      - name: Build and run the checks
        run: ./build.sh test

      - name: Render every page
        run: |
          python3 tools/make-sample-library.py "$RUNNER_TEMP/library" --seconds 5 10
          dotnet run --project tests/Fermata.Ui -c Release -- --screenshots "$RUNNER_TEMP/pages" "$RUNNER_TEMP/library"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pages
          path: ${{ runner.temp }}/pages
          if-no-files-found: ignore
