name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev ffmpeg libmpv2 playerctl dbus fontconfig

      - name: Build and run the checks
        env:
          FERMATA_MPV_LOG: ${{ runner.temp }}/mpv.log
        run: |
          ffmpeg -version | head -1
          ./build.sh test

      - name: Render every page
        timeout-minutes: 10
        run: |
          python3 tools/make-sample-library.py "$RUNNER_TEMP/library" --seconds 5 10
          dotnet build tests/Fermata.Ui -c Release
          dotnet tool install -g dotnet-stack >/dev/null
          dotnet tests/Fermata.Ui/bin/Release/net10.0/Fermata.Ui.dll --screenshots "$RUNNER_TEMP/pages" "$RUNNER_TEMP/library" &
          pid=$!
          for i in $(seq 240); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then
            echo "The page renderer is still running after 4 minutes; its threads:"
            ~/.dotnet/tools/dotnet-stack report -p $pid || true
            kill $pid
            exit 1
          fi
          wait $pid

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pages-and-logs
          path: |
            ${{ runner.temp }}/pages
            ${{ runner.temp }}/mpv.log
          if-no-files-found: ignore
