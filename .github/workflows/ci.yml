name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev ffmpeg libmpv2 playerctl dbus fontconfig \
            sway xwayland bubblewrap jq

      - name: Build and run the checks
        env:
          FERMATA_MPV_LOG: ${{ runner.temp }}/mpv.log
        run: ./build.sh test

      - name: Render every page
        timeout-minutes: 10
        run: |
          python3 tools/make-sample-library.py "$RUNNER_TEMP/library" --seconds 5 10
          dotnet run --project tests/Fermata.Ui -c Release -- --screenshots "$RUNNER_TEMP/pages" "$RUNNER_TEMP/library"

      - name: Run as a Wayland and an X11 client
        timeout-minutes: 5
        env:
          # The runner has no GPU, so sway draws on the CPU.
          WLR_RENDERER: pixman
        run: |
          # Ubuntu 24.04 keeps the unprivileged user namespaces that bubblewrap needs behind AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          tools/isolated-session.sh tools/check-platforms.sh

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pages-and-logs
          path: |
            ${{ runner.temp }}/pages
            ${{ runner.temp }}/mpv.log
          if-no-files-found: ignore
